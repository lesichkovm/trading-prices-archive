name: Daily Update

on:
  schedule:
    # 22:00 UTC = after US market close (16:00 ET)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write  # needed to push back to repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run incremental update
        run: |
          python backfill.py AAPL MSFT GOOGL AMZN TSLA NVDA META BRK-B NEM.DE BTC-USD ETH-USD EURUSD=X GBPUSD=X JPYUSD=X GC=F SI=F CL=F ^GSPC ^DJI ^IXIC ^GDAXI

      - name: Run tests
        run: pytest test_archive.py -v

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — archive is up to date"
          else
            git commit -m "Daily price update $(date -u +%Y-%m-%d)"
            git push
          fi
